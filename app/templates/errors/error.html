{% extends "base.html" %}
{% block title %}{{ title }} · {{ shop_name }}{% endblock %}
{% block content %}
  <div class="card empty">
    <div class="icon" style="font-weight:900;color:var(--muted)">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('shop.home') }}">Back to the shop</a>
  </div>
{% endblock %}
